services:
  student-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-performance-dashboard
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production
